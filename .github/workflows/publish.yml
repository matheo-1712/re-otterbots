name: Publication npm

# Publie le package sur npm et sur GitHub Packages à chaque release GitHub publiée.
# La version est déduite du tag de la release (v1.2.3 ou 1.2.3) : le package.json est mis à jour,
# commité sur la branche de la release, et le tag est déplacé sur ce commit.
on:
  release:
    types: [published]

permissions:
  # Pousser le commit de version et déplacer le tag
  contents: write
  # Nécessaire pour la provenance npm et le Trusted Publishing (OIDC)
  id-token: write
  # Publication sur GitHub Packages (npm.pkg.github.com)
  packages: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      BRANCH: ${{ github.event.release.target_commitish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Mise à jour de la version
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - run: npm run typecheck
      - run: npm run build

      # Commit du package.json sur la branche, puis le tag est replacé dessus
      - name: Commit de la version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- package.json package-lock.json; then
            git add package.json package-lock.json
            git commit -m "chore(release): ${TAG#v}"
            git push origin "HEAD:${BRANCH}"
          fi
          git tag -f "$TAG"
          git push -f origin "refs/tags/$TAG"

      # Les pré-releases partent sur le dist-tag « next » pour ne pas écraser « latest »
      - name: Publication npm
        run: npm publish --provenance --access public --tag ${{ github.event.release.prerelease && 'next' || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # GitHub Packages n'accepte que les packages scopés au propriétaire du dépôt :
      # le nom est scopé uniquement pour cette publication (non commité).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@${{ github.repository_owner }}'

      - name: Publication GitHub Packages
        run: |
          npm pkg set name="@${GITHUB_REPOSITORY_OWNER,,}/$(npm pkg get name | tr -d '"')"
          npm publish --tag ${{ github.event.release.prerelease && 'next' || 'latest' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
