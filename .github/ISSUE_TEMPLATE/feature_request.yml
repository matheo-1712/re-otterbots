name: ✨ Évolution
description: Proposer une fonctionnalité ou une amélioration du moteur
title: '[feat] '
labels:
  - enhancement
body:
  - type: textarea
    id: probleme
    attributes:
      label: Problème à résoudre
      description: Pars du besoin, pas de la solution. Qu'est-ce qui est pénible aujourd'hui ?
      placeholder: |
        Aujourd'hui, chaque commande doit gérer son propre cooldown à la main.
    validations:
      required: true

  - type: textarea
    id: proposition
    attributes:
      label: Proposition
      description: À quoi ressemblerait l'API côté utilisateur du moteur ?
      placeholder: |
        defineCommand({
          data: ...,
          cooldown: 5,
          execute: ...,
        });
    validations:
      required: true

  - type: dropdown
    id: portee
    attributes:
      label: Portée
      options:
        - Ajout rétrocompatible
        - Changement cassant de l'API publique
        - Interne uniquement (aucun impact sur l'API)
        - Je ne sais pas
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives envisagées
      description: Contournements actuels, ou raisons de les écarter.
    validations:
      required: false
